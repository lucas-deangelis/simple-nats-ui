name: Build & Push Production Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      # You can either hard-code the version here or later extract it dynamically.
      IMAGE_VERSION: "0.1.4"
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/simple-nats-ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Nix with flakes
        uses: cachix/install-nix-action@v16
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build production docker image using flake.nix (latest)
        run: |
          nix build .#dockerLatest -o result_latest
          ls -l result_latest

      - name: Load docker image (latest)
        run: |
          docker load -i result_latest

      - name: Tag and push latest image to GHCR
        run: |
          docker tag simple-nats-ui ${IMAGE_NAME}:latest
          echo ${{ secrets.CR_PAT }} | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
          docker push ${IMAGE_NAME}:latest

      # ---- Additional steps for the versioned image ----

      - name: Build production docker image using flake.nix (versioned)
        run: |
          nix build .#docker -o result_version
          ls -l result_version

      - name: Load versioned docker image
        run: |
          docker load -i result_version

      - name: Tag and push versioned image to GHCR
        run: |
          docker tag simple-nats-ui ${IMAGE_NAME}:${IMAGE_VERSION}
          echo ${{ secrets.CR_PAT }} | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
          docker push ${IMAGE_NAME}:${IMAGE_VERSION}
